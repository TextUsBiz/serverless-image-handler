version: 2.1

parameters:
  force:
    type: boolean
    default: false
  scheduled:
    type: boolean
    default: false

orbs:
  aws-cli: circleci/aws-cli@5

executors:
  circleci-node-img:
    docker:
      - image: cimg/node:lts
  circleci-img:
    docker:
      - image: cimg/base:current

commands:
  aws-configure:
    description: "AWS Configuration"
    parameters:
      profile_name:
        type: string
      role_arn:
        type: string
    steps:
      - aws-cli/setup:
          profile_name: "default"
          role_arn: "${AWS_DEFAULT_OIDC_ROLE}"
          region: "us-west-2"
          role_session_name: "circle-tf-backend"
          session_duration: "1800"
      - aws-cli/setup:
          profile_name: << parameters.profile_name >>
          role_arn: << parameters.role_arn >>
          region: "us-east-1"
          role_session_name: "circle-tf-<< parameters.profile_name >>"
          session_duration: "1800"

  aws-dynamic_image_transformation_for_amazon_cloudfront-install:
    description: "Clean install all Node resources"
    steps:
      - run:
          name: Clean Install
          command: |
            cd source/constructs
            npm run clean:install

  aws-dynamic_image_transformation_for_amazon_cloudfront-bootstrap:
    description: "Bootstrap the AWS Resources"
    parameters:
      profile_name:
        type: string
    steps:
      - run:
          name: Bootstrap
          command: |
            cd source/constructs
            overrideWarningsEnabled=false npx cdk bootstrap --profile << parameters.profile_name >>

  aws-dynamic_image_transformation_for_amazon_cloudfront-deploy:
    description: "Deploy the AWS Dynamic Image Transformation for Amazon Cloudfront"
    parameters:
      profile_name:
        type: string
    steps:
      - run:
          name: Deploy Cloudformation Stack
          environment:
            ENVIRONMENT: << parameters.profile_name >>
          command: |
            cd source/constructs

            LOG_RETENTION=30
            CORS_ORIGINS='*'
            SOURCE_BUCKET=tesseract.${ENVIRONMENT:0:4}.conversation-attachment

            if [[ ${ENVIRONMENT} == "production" ]]; then
              LOG_RETENTION=365
              CORS_ORIGINS="${PRODUCTION_CORS_ORIGINS}"
            fi

            overrideWarningsEnabled=false npx cdk deploy v7-Stack \
              --parameters DeployDemoUIParameter=No      \
              --parameters LogRetentionPeriodParameter=${LOG_RETENTION} \
              --parameters CloudFrontPriceClassParameter=PriceClass_100 \
              --parameters AutoWebPParameter=Yes    \
              --parameters CorsEnabledParameter=Yes \
              --parameters CorsOriginParameter="${CORS_ORIGINS}"   \
              --parameters SourceBucketsParameter=${SOURCE_BUCKET} \
              --profile ${ENVIRONMENT} \
              --require-approval never

  aws-dynamic_image_transformation_for_amazon_cloudfront-publish_host:
    description: "Publish the deployed CloudFront host for the Tesseract app"
    #
    # The app builds resized-image URLs against this distribution, so it needs the
    # hostname. Published here, by the pipeline that creates the stack, rather than read
    # by the object-storage runbook: that runbook only re-applies when its own *.tf files
    # change, so a replaced distribution would leave a dead host published indefinitely.
    #
    parameters:
      profile_name:
        type: string
    steps:
      - run:
          name: Verify Stack Outputs
          environment:
            ENVIRONMENT: << parameters.profile_name >>
            # Must match whatever `cdk deploy` above produced. The CDK app declares the
            # construct id as v7-Stack while the long-standing deployed stack is named
            # ServerlessImageHandlerStack; until that is reconciled, this is the one line
            # to change.
            STACK_NAME: v7-Stack
          command: |
            SOURCE_BUCKET=tesseract.${ENVIRONMENT:0:4}.conversation-attachment

            stack_output () {
              aws cloudformation describe-stacks \
                --stack-name "${STACK_NAME}" \
                --query "Stacks[0].Outputs[?OutputKey=='${1}'].OutputValue" \
                --output text --profile "${ENVIRONMENT}"
            }

            ENDPOINT=$(stack_output ApiEndpoint)
            BUCKETS=$(stack_output SourceBuckets)

            if [[ -z "${ENDPOINT}" || "${ENDPOINT}" == "None" ]]; then
              printf 'Stack %s exposed no ApiEndpoint output.\n' "${STACK_NAME}"
              exit 1
            fi

            # The handler validates requested buckets against its own SourceBuckets and
            # rejects anything else, so a mismatch 403s every resized image: avatars,
            # account logos, saved-reply thumbnails, webhook and push images.
            if [[ ",${BUCKETS}," != *",${SOURCE_BUCKET},"* ]]; then
              printf 'Stack SourceBuckets=%s does not include %s.\n' "${BUCKETS}" "${SOURCE_BUCKET}"
              exit 1
            fi

            # Bare host, no scheme, to match the object-store config convention so the app
            # never strips or adds one. printf rather than echo: echo would append a
            # newline into the stored value.
            printf '%s' "${ENDPOINT#https://}" > /tmp/image_handler_host

            printf 'Verified %s against %s\n' "${ENDPOINT}" "${SOURCE_BUCKET}"

      - run:
          name: Publish Host to Secrets Manager
          environment:
            ENVIRONMENT: << parameters.profile_name >>
            HOST_SECRET_ID: tesseract/image_handler/host
          command: |
            if aws secretsmanager describe-secret --secret-id "${HOST_SECRET_ID}" \
                 --profile "${ENVIRONMENT}" >/dev/null 2>&1; then
              aws secretsmanager put-secret-value \
                --secret-id "${HOST_SECRET_ID}" \
                --secret-string "file:///tmp/image_handler_host" \
                --profile "${ENVIRONMENT}" >/dev/null
              printf 'Updated %s = %s\n' "${HOST_SECRET_ID}" "$(cat /tmp/image_handler_host)"
            else
              aws secretsmanager create-secret \
                --name "${HOST_SECRET_ID}" \
                --secret-string "file:///tmp/image_handler_host" \
                --description "Dynamic Image Transformation CloudFront host, bare (no scheme). Published by this pipeline on every deploy." \
                --profile "${ENVIRONMENT}" >/dev/null
              printf 'Created %s = %s\n' "${HOST_SECRET_ID}" "$(cat /tmp/image_handler_host)"
            fi

  aws-ses-email:
    description: "Email DevOps for approval"
    steps:
      - run:
          name: Email
          command: |
            email_message () {
              local subject="${1}"
              local message="${2}"

              jq -n \
                --arg     subject "${subject}" \
                --argjson message "${message}" \
                '.Subject.Data = $subject | .Body.Html.Data = $message' \
                /home/circleci/project/.circleci/email-message.json.template
            }

            export CIRCLE_PIPELINE_NUM=<< pipeline.number >>
            export LATEST_GIT_SHA=$(git rev-parse HEAD)
            export PIPELINE_URL="https://app.circleci.com/pipelines/github/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}/${CIRCLE_PIPELINE_NUM}/workflows/${CIRCLE_WORKFLOW_ID}"
            export CREATED_AT=$(date '+%B %d, %Y at %I:%M %p %Z')
            export SUPPORT_EMAIL="devops@textus.com"
            export EMAIL_SUBJECT="CircleCI Pipeline Request for Approval"
            export EMAIL_HTML_BODY=$(cat /home/circleci/project/.circleci/email-body.html.template | envsubst | jq -Rs .)

            aws ses send-email \
              --from        "devops@textus.com" \
              --destination "ToAddresses=devops+circleci@textus.com" \
              --message     "$(email_message "${EMAIL_SUBJECT}" "${EMAIL_HTML_BODY}")" \
              --profile     default

  git-clone:
    description: "Homebrew Circle Git Clone to bypass current SHA"
    steps:
      - run:
          name: Checkout
          command: |
            mkdir -p ~/.ssh
            ssh-keyscan github.com >> ~/.ssh/known_hosts
            git clone --depth 1 $CIRCLE_REPOSITORY_URL .
            git rev-parse HEAD

jobs:
  welcome:
    executor: circleci-img
    resource_class: small
    steps:
      - run:
          name: Welcome
          command: |
            cat \<<'WELCOME'
              __          __  _                            _______
              \ \        / / | |                          |__   __|  _
               \ \  /\  / /__| | ___ ___  _ __ ___   ___     | | ___(_)
                \ \/  \/ / _ \ |/ __/ _ \| '_ ` _ \ / _ \    | |/ _ \
                 \  /\  /  __/ | (_| (_) | | | | | |  __/    | | (_) |
                __\/_ \/ \___|_|\___\___/|_| |_| |_|\___|    |_|\___(_)                             _    _                 _ _              _____ _____
               / ____|                        | |               |_   _|                            | |  | |               | | |            / ____|_   _|
              | (___   ___ _ ____   _____ _ __| | ___  ___ ___    | |  _ __ ___   __ _  __ _  ___  | |__| | __ _ _ __   __| | | ___ _ __  | |      | |
               \___ \ / _ \ '__\ \ / / _ \ '__| |/ _ \/ __/ __|   | | | '_ ` _ \ / _` |/ _` |/ _ \ |  __  |/ _` | '_ \ / _` | |/ _ \ '__| | |      | |
               ____) |  __/ |   \ V /  __/ |  | |  __/\__ \__ \  _| |_| | | | | | (_| | (_| |  __/ | |  | | (_| | | | | (_| | |  __/ |    | |____ _| |_
              |_____/ \___|_|    \_/ \___|_|  |_|\___||___/___/ |_____|_| |_| |_|\__,_|\__, |\___| |_|  |_|\__,_|_| |_|\__,_|_|\___|_|     \_____|_____|
                                                                                        __/ |
                                                                                       |___/
            WELCOME

  install:
    executor: circleci-node-img
    steps:
      - git-clone
      - aws-dynamic_image_transformation_for_amazon_cloudfront-install
      - persist_to_workspace:
          root: .
          paths:
            - .

  deploy:
    executor: circleci-node-img
    parameters:
      profile_name:
        type: string
      role_arn:
        type: string
    steps:
      - attach_workspace:
          at: .
      - aws-configure:
          profile_name: << parameters.profile_name >>
          role_arn: << parameters.role_arn >>
      - aws-dynamic_image_transformation_for_amazon_cloudfront-bootstrap:
          profile_name: << parameters.profile_name >>
      - aws-dynamic_image_transformation_for_amazon_cloudfront-deploy:
          profile_name: << parameters.profile_name >>
      - aws-dynamic_image_transformation_for_amazon_cloudfront-publish_host:
          profile_name: << parameters.profile_name >>

  email-approval_request:
    executor: circleci-img
    resource_class: small
    parameters:
      profile_name:
        type: string
      role_arn:
        type: string
    steps:
      - attach_workspace:
          at: .
      - aws-configure:
          profile_name: << parameters.profile_name >>
          role_arn: << parameters.role_arn >>
      - aws-ses-email

workflows:
  deploy-serverless_image_handler:
    jobs:
      - welcome
      - install
      - deploy:
          name: "development_deploy"
          profile_name: "development"
          role_arn: "${AWS_DEVE_ROLE_ARN}"
          requires:
            - install
      - deploy:
          name: "integration_deploy"
          profile_name: "integration"
          role_arn: "${AWS_INTE_ROLE_ARN}"
          requires:
            - development_deploy
      - deploy:
          name: "staging_deploy"
          profile_name: "staging"
          role_arn: "${AWS_STAG_ROLE_ARN}"
          requires:
            - integration_deploy
      - email-approval_request:
          profile_name: "development"
          role_arn: "${AWS_DEVE_ROLE_ARN}"
          requires:
            - staging_deploy
      - hold:
          name: approve-production-deploy
          type: approval
          requires:
            - staging_deploy
      - deploy:
          name: "production_deploy"
          profile_name: "production"
          role_arn: "${AWS_PROD_ROLE_ARN}"
          requires:
            - approve-production-deploy
